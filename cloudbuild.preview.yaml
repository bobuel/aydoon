substitutions:
  _REGION: us-west1
  _SERVICE: aydoon-employer-preview
  _GEMINI_MODEL: gemini-2.5-flash
  _SERVICE_ACCOUNT: aydoon-employer-preview

steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/aydoon-preview/portfolio:${SHORT_SHA}", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/aydoon-preview/portfolio:${SHORT_SHA}"]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/aydoon-preview/portfolio:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --no-allow-unauthenticated
      - --service-account=${_SERVICE_ACCOUNT}@${PROJECT_ID}.iam.gserviceaccount.com
      - --set-env-vars=PREVIEW_MODE=true,GEMINI_MODEL=${_GEMINI_MODEL}
      - --set-secrets=GEMINI_API_KEY=aydoon-employer-preview-gemini:latest
      - --max-instances=2
      - --memory=512Mi
      - --cpu=1

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/aydoon-preview/portfolio:${SHORT_SHA}

